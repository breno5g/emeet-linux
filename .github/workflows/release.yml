name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Set version from tag
        run: sed -i "s/^version = .*/version = \"${GITHUB_REF_NAME#v}\"/" pyproject.toml
      - name: Build wheel
        run: |
          python3 -m pip install --user build
          python3 -m build --wheel
      - name: Assemble tarball
        run: |
          set -eu
          name="emeet-linux-${GITHUB_REF_NAME}"
          mkdir -p "out/$name"
          cp dist/emeet_linux-*.whl install.sh README.md "out/$name/"
          cp -r data "out/$name/data"
          tar -C out -czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" dist/emeet_linux-*.whl > SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        # upload with --clobber when the release already exists, so a re-pushed tag refreshes the assets
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" emeet-linux-*.tar.gz dist/emeet_linux-*.whl SHA256SUMS --clobber
          else
            gh release create "$GITHUB_REF_NAME" emeet-linux-*.tar.gz dist/emeet_linux-*.whl SHA256SUMS --generate-notes
          fi

  flatpak:
    needs: release
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Set version from tag
        run: |
          v="${GITHUB_REF_NAME#v}"
          sed -i "s/^version = .*/version = \"$v\"/" pyproject.toml
          sed -i "s/<release version=\"[^\"]*\" date=\"[^\"]*\"\/>/<release version=\"$v\" date=\"$(date -u +%F)\"\/>/" data/io.github.breno5g.emeet.metainfo.xml
      - name: Build Flatpak bundle
        # the flathub-infra repo publishes no tags, pin to a commit of master
        uses: flathub-infra/flatpak-github-actions/flatpak-builder@933e9e8ca36e85046ebca8e211f0785c6becac40
        with:
          manifest-path: io.github.breno5g.emeet.json
          bundle: io.github.breno5g.emeet.flatpak
          cache-key: flatpak-builder-${{ github.sha }}
          upload-artifact: false
      - name: Attach bundle to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: io.github.breno5g.emeet.flatpak
